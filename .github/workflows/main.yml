
name: Build Mitra AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix Kotlin plugin repositories
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          flutter = Path(shutil.which("flutter")).resolve()
          sdk = flutter.parent.parent
          p = sdk / "packages/flutter_tools/gradle/settings.gradle.kts"

          s = p.read_text()
          block = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          """
          if "pluginManagement {" not in s:
              p.write_text(block + s)
          PY
      - name: Create Android project files
        run: flutter create --platforms=android .

      - name: Get dependencies
        
      - name: Install Android NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          for i in 1 2 3; do
            "$SDKMANAGER" --install "ndk;28.2.13676358" && exit 0
            rm -rf "${ANDROID_HOME}/ndk/28.2.13676358"
            sleep 10
          done
          exit 1
          run: flutter pub get
      - name: Add microphone permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace("<application", '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          p.write_text(s)
          PY
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mitra-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
